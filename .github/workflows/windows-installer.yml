name: Instalador Windows

# O instalador precisa de um Windows completo (NSIS + electron-builder). Rodar
# aqui também evita depender da máquina de quem desenvolve e, principalmente,
# permite assinar o executável depois com um certificado de code signing.
on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  instalar:
    name: Gerar Ponto-Digital-Setup.exe
    runs-on: windows-latest
    env:
      # Assinatura de código: sem estes secrets o electron-builder gera o
      # instalador sem assinatura (SmartScreen avisa na primeira execução).
      # CSC_LINK aceita o .pfx em base64 ou uma URL; CSC_KEY_PASSWORD é a senha.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Cache do Electron e do runtime embutido
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            node_modules\.cache\node-runtime
          key: ${{ runner.os }}-desktop-${{ hashFiles('desktop/package.json', 'scripts/portable/node-runtime.mjs') }}

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes do launcher
        run: pnpm --filter @workspace/desktop test

      - name: Testes da API
        run: pnpm --filter @workspace/api-server test

      - name: Gerar pacote portable
        run: pnpm build:portable

      - name: Gerar desktop descompactado
        run: node scripts/desktop/build-installer.mjs --skip-portable --dir

      - name: Gerar instalador
        run: node scripts/desktop/build-installer.mjs --skip-portable

      - name: Conferir arquivos reais do pacote Electron
        shell: pwsh
        run: |
          $portable = Join-Path $PWD "dist-desktop\win-unpacked\resources\portable"
          $server = Join-Path $portable "server"
          $required = @(
            "runtime\node.exe",
            "server\portable.mjs",
            "server\front\index.html",
            "server\migrations\0001_aspiring_peter_quill.sql",
            "server\node_modules\@electric-sql\pglite\package.json",
            "server\thread-stream-worker.mjs",
            "server\pino-worker.mjs",
            "server\pino-file.mjs",
            "server\pino-pretty.mjs",
            "server\pdfium.wasm",
            "server\ocr\tessdata\por.traineddata.gz",
            "server\ocr\tessdata\eng.traineddata.gz"
          )
          foreach ($relative in $required) {
            $file = Join-Path $portable $relative
            if (-not (Test-Path -LiteralPath $file)) { throw "Arquivo ausente no pacote final: $file" }
          }
          $workspace = $env:GITHUB_WORKSPACE
          $bundles = Get-ChildItem -LiteralPath $server -Recurse -File -Include *.mjs,*.js
          foreach ($bundle in $bundles) {
            $source = Get-Content -LiteralPath $bundle.FullName -Raw
            if ($source.Contains($workspace) -or $source.Contains($workspace.Replace('\', '\\'))) {
              throw "Caminho do workspace encontrado no bundle: $($bundle.FullName)"
            }
          }
          "Arquivos portable presentes; nenhum bundle contém o workspace $workspace."

      - name: Criar ZIP portátil Windows
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $source = Join-Path $PWD "dist-desktop\win-unpacked"
          $zip = Join-Path $PWD "dist-installer\Ponto-Digital-Windows-v$version.zip"
          if (-not (Test-Path (Join-Path $source "Ponto Digital.exe"))) { throw "EXE ausente no desktop descompactado" }
          Compress-Archive -Path (Join-Path $source "*") -DestinationPath $zip -CompressionLevel Optimal -Force
          if (-not (Test-Path $zip)) { throw "ZIP portátil não foi criado" }
          "ZIP criado: $zip"

      - name: Testar instalador e ZIP no Windows
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $installer = "dist-installer/Ponto-Digital-Setup-$version.exe"
          $zip = "dist-installer/Ponto-Digital-Windows-v$version.zip"
          if (-not (Test-Path $installer)) { throw "Instalador não encontrado: $installer" }
          if (-not (Test-Path $zip)) { throw "ZIP não encontrado: $zip" }
          ./scripts/desktop/smoke-test-installed.ps1 -InstallerPath $installer -ZipPath $zip

      - name: Conferir instalador e assinatura
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist-installer/Ponto-Digital-Setup-*.exe | Select-Object -First 1
          if (-not $exe) { throw "Instalador nao encontrado em dist-installer" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          "Arquivo: {0} ({1:N1} MB)" -f $exe.Name, ($exe.Length / 1MB)
          "Assinatura: {0}" -f $sig.Status
          if ($sig.SignerCertificate) { "Assinado por: {0}" -f $sig.SignerCertificate.Subject }
          if ($env:CSC_LINK -and $sig.Status -ne "Valid") {
            throw "Instalador deveria estar assinado, mas a assinatura esta $($sig.Status)"
          }

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: Ponto-Digital-Windows-v1.0.2
          path: |
            dist-installer/Ponto-Digital-Setup-*.exe
            dist-installer/Ponto-Digital-Windows-v*.zip
          if-no-files-found: error

      - name: Anexar à release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist-installer/Ponto-Digital-Setup-*.exe
            dist-installer/Ponto-Digital-Windows-v*.zip
