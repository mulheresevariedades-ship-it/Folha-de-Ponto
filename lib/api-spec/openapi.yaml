openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API do Ponto Digital DIGEP em modo de demonstração
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: operations
    description: Operações de folhas de ponto
  - name: employees
    description: Cadastro e importação de servidores
  - name: calendar
    description: Calendário acadêmico
  - name: dispatches
    description: Fila e histórico de envios demonstrativos
  - name: settings
    description: Configurações da demonstração
  - name: coordination
    description: Controle de concorrência
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /ocr-diagnostico:
    get:
      operationId: getOcrDiagnostics
      tags: [health]
      summary: Diagnóstico do OCR
      description: >
        Situação do OCR no servidor: se o motor existe, se o modelo de idioma
        está presente e qual foi a última falha. Sem caminhos de arquivo.
      responses:
        "200":
          description: Diagnóstico do OCR
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OcrDiagnostics"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [operations]
      summary: Resumo da competência
      parameters:
        - name: competency
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Métricas atuais
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMetrics"
  /timesheets:
    get:
      operationId: listTimesheets
      tags: [operations]
      summary: Lista folhas com filtros opcionais
      parameters:
        - name: competency
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Folhas encontradas
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Timesheet" }
  /timesheets/{id}:
    get:
      operationId: getTimesheet
      tags: [operations]
      summary: Detalhes de uma folha
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Folha encontrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }
        "404": { description: Folha não encontrada }
  /timesheets/{id}/review:
    patch:
      operationId: reviewTimesheet
      tags: [operations]
      summary: Confirma, encaminha ou rejeita uma folha
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TimesheetReviewInput" }
      responses:
        "200":
          description: Folha atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Timesheet" }
        "400": { description: Dados de revisão inválidos }
        "404": { description: Folha não encontrada }
  /timesheets/{id}/file:
    get:
      operationId: getTimesheetFile
      tags: [operations]
      summary: Abre o PDF de demonstração
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { description: Arquivo não encontrado }
  /timesheets/generate:
    get:
      operationId: generateTimesheet
      tags: [operations]
      summary: Gera folha DOCX com os dias especiais do calendário
      parameters:
        - name: employeeId
          in: query
          required: true
          schema: { type: integer }
        - name: competency
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Documento DOCX
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema: { type: string, format: binary }
        "404": { description: Servidor não encontrado }
  /batches/preview:
    post:
      operationId: previewBatch
      tags: [operations]
      summary: Analisa PDFs sem gravar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BatchUploadInput" }
      responses:
        "200":
          description: Prévia do lote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPreview" }
        "400": { description: Arquivo ou formulário inválido }
  /batches:
    post:
      operationId: processBatch
      tags: [operations]
      summary: Arquiva as páginas após confirmação
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/BatchUploadInput" }
      responses:
        "201":
          description: Lote processado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchProcessResult" }
        "409":
          description: Há duplicidades que exigem confirmação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BatchPreview" }
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: Lista e pesquisa servidores
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Servidores encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Employee" }
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Cadastra um servidor
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeInput" }
      responses:
        "201":
          description: Servidor criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "409": { description: Matrícula já cadastrada }
  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Atualiza um servidor
      parameters:
        - $ref: "#/components/parameters/NumericId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeUpdate" }
      responses:
        "200":
          description: Servidor atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Employee" }
        "404": { description: Servidor não encontrado }
    delete:
      operationId: deleteEmployee
      tags: [employees]
      summary: Desativa um servidor
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "204": { description: Servidor desativado }
        "404": { description: Servidor não encontrado }
  /employees/import/preview:
    post:
      operationId: previewEmployeeImport
      tags: [employees]
      summary: Valida planilha e calcula novos, atualizados e ignorados
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SpreadsheetUpload" }
      responses:
        "200":
          description: Resumo da importação
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "422": { description: Cabeçalhos ou linhas inválidos }
  /employees/import:
    post:
      operationId: importEmployees
      tags: [employees]
      summary: Confirma a importação da planilha
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SpreadsheetUpload" }
      responses:
        "200":
          description: Importação concluída
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSummary" }
        "422": { description: Cabeçalhos ou linhas inválidos }
  /calendar:
    get:
      operationId: listCalendarDates
      tags: [calendar]
      summary: Lista datas especiais
      parameters:
        - name: year
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: Datas especiais
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CalendarEvent" }
    post:
      operationId: createCalendarDate
      tags: [calendar]
      summary: Cadastra data especial
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventInput" }
      responses:
        "201":
          description: Data cadastrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
        "409": { description: Já existe um evento nesta data }
  /calendar/{id}:
    patch:
      operationId: updateCalendarDate
      tags: [calendar]
      summary: Atualiza data especial
      parameters:
        - $ref: "#/components/parameters/NumericId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarEventUpdate" }
      responses:
        "200":
          description: Data atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarEvent" }
        "404": { description: Data não encontrada }
    delete:
      operationId: deleteCalendarDate
      tags: [calendar]
      summary: Remove data especial
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "204": { description: Data removida }
        "404": { description: Data não encontrada }
  /calendar/import/preview:
    post:
      operationId: previewCalendarImport
      tags: [calendar]
      summary: Valida calendário XLSX e calcula o resumo
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SpreadsheetUpload" }
      responses:
        "200":
          description: Prévia do calendário
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "422": { description: Cabeçalhos ou datas inválidos }
  /calendar/import:
    post:
      operationId: importCalendar
      tags: [calendar]
      summary: Confirma a importação do calendário
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/SpreadsheetUpload" }
      responses:
        "200":
          description: Importação concluída
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportSummary" }
        "422": { description: Cabeçalhos ou datas inválidos }
  /dispatches:
    get:
      operationId: listDispatches
      tags: [dispatches]
      summary: Lista fila e histórico com pesquisa
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Data inicial de criacao do envio (AAAA-MM-DD)
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Data final de criacao do envio (AAAA-MM-DD)
      responses:
        "200":
          description: Registros de envio
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Dispatch" }
  /dispatches/{id}/send:
    patch:
      operationId: sendDispatch
      tags: [dispatches]
      summary: Registra envio de demonstração individual
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "200":
          description: Envio de demonstração registrado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispatch" }
        "404": { description: Despacho não encontrado }
  /dispatches/{id}/resend:
    patch:
      operationId: resendDispatch
      tags: [dispatches]
      summary: Registra nova tentativa demonstrativa
      parameters:
        - $ref: "#/components/parameters/NumericId"
      responses:
        "200":
          description: Nova tentativa registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dispatch" }
        "404": { description: Despacho não encontrado }
  /dispatches/send-batch:
    post:
      operationId: sendDispatchBatch
      tags: [dispatches]
      summary: Registra envios demonstrativos em grupo
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DispatchBatchInput" }
      responses:
        "200":
          description: Resumo do lote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DispatchBatchResult" }
  /audit:
    get:
      operationId: listAudit
      tags: [operations]
      summary: Pesquisa histórico de alterações e envios
      parameters:
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Eventos encontrados
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
  /settings/smtp:
    get:
      operationId: getSmtpSettings
      tags: [settings]
      summary: Lê configuração sem expor a senha
      responses:
        "200":
          description: Configuração de demonstração
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpSettings" }
    put:
      operationId: updateSmtpSettings
      tags: [settings]
      summary: Salva configuração SMTP para apresentação, sem conectar ou enviar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SmtpSettingsInput" }
      responses:
        "200":
          description: Configuração salva
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpSettings" }
  /settings/smtp/test:
    post:
      operationId: testSmtpSettings
      tags: [settings]
      summary: Abre conexão com o servidor SMTP para validar autenticação e credenciais
      responses:
        "200":
          description: Resultado da validação local
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SmtpTestResult" }
  /lock:
    get:
      operationId: getLockState
      tags: [coordination]
      summary: Consulta o aviso de concorrência
      parameters:
        - name: sessionId
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Estado do bloqueio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockState" }
  /lock/heartbeat:
    post:
      operationId: heartbeatLock
      tags: [coordination]
      summary: Renova a sessão de edição
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockSessionInput" }
      responses:
        "200":
          description: Estado atualizado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockState" }
  /lock/release:
    post:
      operationId: releaseLock
      tags: [coordination]
      summary: Libera sessão de edição
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LockSessionInput" }
      responses:
        "200":
          description: Bloqueio liberado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LockState" }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string }
    NumericId:
      name: id
      in: path
      required: true
      schema: { type: integer }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OcrDiagnostics:
      type: object
      properties:
        motorDisponivel: { type: boolean }
        workerEmbutido: { type: boolean }
        modeloLocal:
          type: object
          properties:
            encontrado: { type: boolean }
            idiomas: { type: array, items: { type: string } }
            arquivos: { type: array, items: { type: string } }
            status: { type: [string, "null"] }
        cacheModelos: { type: integer }
        ultimaFalha:
          type: [object, "null"]
          properties:
            motivo: { type: string }
            em: { type: string }
            mensagem: { type: string }
      required:
        - motorDisponivel
        - modeloLocal
        - cacheModelos
    DashboardMetrics:
      type: object
      properties:
        total: { type: integer }
        recognized: { type: integer }
        review: { type: integer }
        low_confidence: { type: integer }
        archived: { type: integer }
        recognition_rate: { type: integer }
        dispatch_pending: { type: integer }
        dispatch_sent: { type: integer }
        dispatch_error: { type: integer }
      required: [total, recognized, review, low_confidence, archived, recognition_rate, dispatch_pending, dispatch_sent, dispatch_error]
    Timesheet:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        matricula: { type: [string, "null"] }
        competencia: { type: string }
        confidence: { type: integer }
        status: { type: string }
        status_label: { type: string }
        reviewed_at: { type: [string, "null"], format: date-time }
        note: { type: [string, "null"] }
        file_url: { type: [string, "null"] }
      required: [id, name, matricula, competencia, confidence, status, status_label, reviewed_at]
    TimesheetReviewInput:
      type: object
      properties:
        action: { type: string, enum: [confirm, pending, reject] }
        name: { type: string }
        matricula: { type: string }
        competency: { type: string }
        note: { type: string }
      required: [action]
    Employee:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        matricula: { type: string }
        cpf: { type: string }
        email: { type: string }
        cargo: { type: string }
        carga_horaria: { type: integer }
        acumula: { type: boolean }
      required: [id, name, matricula, cpf, email, cargo, carga_horaria, acumula]
    EmployeeInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        matricula: { type: string, minLength: 1 }
        cpf: { type: string }
        email: { type: string }
        cargo: { type: string }
        workloadHours: { type: integer, minimum: 1, maximum: 100 }
        accumulatesRole: { type: boolean }
      required: [name, matricula]
    EmployeeUpdate:
      type: object
      properties:
        name: { type: string }
        matricula: { type: string }
        cpf: { type: string }
        email: { type: string }
        cargo: { type: string }
        workloadHours: { type: integer, minimum: 1, maximum: 100 }
        accumulatesRole: { type: boolean }
    SpreadsheetUpload:
      type: object
      properties:
        file: { type: string, format: binary }
      required: [file]
    ImportPreviewRow:
      type: object
      properties:
        name: { type: string }
        matricula: { type: string }
        cpf: { type: string }
        email: { type: string }
        workloadHours: { type: integer }
        accumulatesRole: { type: boolean }
        date: { type: string, format: date }
        description: { type: string }
        type: { type: string, enum: [feriado, recesso, ponto_facultativo, suspensao_expediente, outro] }
        action: { type: string }
      required: [action]
    ImportPreview:
      type: object
      properties:
        newCount: { type: integer }
        updatedCount: { type: integer }
        skippedCount: { type: integer, description: Registros ignorados por matrícula repetida na planilha }
        errorCount: { type: integer, description: Registros com erro de estrutura (nome, CPF, carga horária ou e-mail) }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportPreviewRow" }
      required: [newCount, updatedCount, skippedCount, errorCount, rows]
    ImportSummary:
      type: object
      properties:
        imported: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
      required: [imported, updated, skipped]
    BatchUploadInput:
      type: object
      properties:
        files:
          type: array
          items: { type: string, format: binary }
        fallbackCompetency: { type: string }
        replaceDuplicates: { type: boolean }
        confirmFallback: { type: boolean }
      required: [files]
    BatchPreviewItem:
      type: object
      properties:
        sourceFilename: { type: string }
        pageNumber: { type: integer }
        name: { type: string }
        matricula: { type: [string, "null"] }
        competency: { type: string }
        confidence: { type: integer }
        competencyDetected: { type: boolean }
        competencySource:
          type: string
          enum: [conteudo-pdf, ocr-conteudo-pdf, fallback, nao-identificada]
          description: Origem da competência — camada de texto do PDF, OCR da página digitalizada, competência de referência ou não identificada
        ocrApplied: { type: boolean, description: A leitura da página foi feita por OCR }
        ocrUnavailable: { type: boolean, description: Nenhuma estratégia de OCR funcionou nesta página }
        ocrUnavailableReason:
          type: [string, "null"]
          enum: [modelo-indisponivel, tempo-limite, motor-indisponivel, leitura-falhou, null]
          description: Por que o OCR não conseguiu ler a página
        duplicate: { type: boolean }
        duplicateInUpload: { type: boolean }
        duplicateReason: { type: [string, "null"] }
        needsReview: { type: boolean }
      required: [sourceFilename, pageNumber, name, matricula, competency, competencyDetected, competencySource, ocrApplied, ocrUnavailable, ocrUnavailableReason, confidence, duplicate, duplicateInUpload, duplicateReason, needsReview]
    BatchError:
      type: object
      properties:
        sourceFilename: { type: string }
        pageNumber: { type: [integer, "null"] }
        message: { type: string }
      required: [sourceFilename, message]
    BatchFileResult:
      type: object
      properties:
        sourceFilename: { type: string }
        pages: { type: integer }
        status: { type: string, enum: [processado, erro] }
        message: { type: [string, "null"] }
      required: [sourceFilename, pages, status, message]
    BatchSkippedDetail:
      type: object
      properties:
        sourceFilename: { type: string }
        pageNumber: { type: integer }
        name: { type: string }
        competency: { type: string }
        reason: { type: string }
      required: [sourceFilename, pageNumber, name, competency, reason]
    BatchPreview:
      type: object
      properties:
        entries:
          type: array
          items: { $ref: "#/components/schemas/BatchPreviewItem" }
        newCount: { type: integer }
        duplicateCount: { type: integer }
        reviewCount: { type: integer }
        unidentifiedCount: { type: integer }
        errors:
          type: array
          items: { $ref: "#/components/schemas/BatchError" }
        fileResults:
          type: array
          items: { $ref: "#/components/schemas/BatchFileResult" }
      required: [entries, newCount, duplicateCount, reviewCount, unidentifiedCount, errors, fileResults]
    BatchProcessResult:
      type: object
      properties:
        created: { type: integer }
        updated: { type: integer }
        skipped: { type: integer }
        duplicatesInBatch: { type: integer }
        entries:
          type: array
          items: { $ref: "#/components/schemas/BatchPreviewItem" }
        errors:
          type: array
          items: { $ref: "#/components/schemas/BatchError" }
        skippedDetails:
          type: array
          items: { $ref: "#/components/schemas/BatchSkippedDetail" }
        fileResults:
          type: array
          items: { $ref: "#/components/schemas/BatchFileResult" }
      required: [created, updated, skipped, duplicatesInBatch, entries, errors, skippedDetails, fileResults]
    CalendarEvent:
      type: object
      properties:
        id: { type: integer }
        date: { type: string, format: date }
        description: { type: string }
        type: { type: string, enum: [feriado, recesso, ponto_facultativo, suspensao_expediente, outro] }
      required: [id, date, description, type]
    CalendarEventInput:
      type: object
      properties:
        date: { type: string, format: date }
        description: { type: string, minLength: 1 }
        type: { type: string, enum: [feriado, recesso, ponto_facultativo, suspensao_expediente, outro] }
      required: [date, description, type]
    CalendarEventUpdate:
      type: object
      properties:
        date: { type: string, format: date }
        description: { type: string }
